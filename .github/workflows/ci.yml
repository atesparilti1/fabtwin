name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: mypy fabtwin
      - run: pytest --cov=fabtwin --cov-fail-under=80
      - name: smoke benchmark
        run: python scripts/bench_dispatch.py --reps 4 --warmup-reps 2 --out /tmp/smoke
