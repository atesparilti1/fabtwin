[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fabtwin"
version = "0.1.0"
description = "Stochastic scheduling and transport optimization for a semiconductor fab (digital twin)"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "scipy>=1.11", "ortools>=9.10", "highspy>=1.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.10"]

[tool.setuptools.packages.find]
include = ["fabtwin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
