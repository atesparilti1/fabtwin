[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fabtwin"
version = "0.1.0"
description = "Stochastic scheduling and transport optimization for a semiconductor fab (digital twin)"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "scipy>=1.11", "ortools>=9.10", "highspy>=1.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.10"]

[tool.setuptools.packages.find]
include = ["fabtwin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

# OR-Tools' and HiGHS' bundled stubs lag their runtime APIs (CamelCase CP-SAT
# methods, untyped Highs); the two solver-binding modules are checked leniently.
[[tool.mypy.overrides]]
module = ["fabtwin.core.cpsat", "fabtwin.core.mip", "fabtwin.core.decomposition"]
disable_error_code = ["attr-defined", "arg-type", "no-untyped-call", "assignment", "index", "call-overload"]
